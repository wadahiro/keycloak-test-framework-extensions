name: CI

on:
  push:
    branches-ignore: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  release-scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: bash scripts/tests/release.sh

  maven-cache:
    name: Prime Maven dependency cache
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        id: setup-java
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: |
            **/pom.xml
            .github/maven-cache-key
      - name: Resolve dependencies for every Keycloak profile
        if: steps.setup-java.outputs.cache-hit != 'true'
        shell: bash
        run: |
          for profile in undertow15 keycloak20 keycloak21 keycloak22 keycloak23 keycloak24 keycloak25 keycloak26; do
            echo "Priming Maven cache for $profile"
            mvn -B -P"$profile" dependency:go-offline dependency:resolve-plugins
          done
          echo "Priming the dynamically selected JUnit Platform provider"
          mvn -B org.apache.maven.plugins:maven-dependency-plugin:3.8.1:get \
            -Dartifact=org.apache.maven.surefire:surefire-junit-platform:3.5.4
          echo "Priming the JUnit Platform launcher used by the Java 11 unit-test module"
          mvn -B org.apache.maven.plugins:maven-dependency-plugin:3.8.1:get \
            -Dartifact=org.junit.platform:junit-platform-launcher:1.10.3

  test:
    name: Keycloak ${{ matrix.keycloak }} / server JDK ${{ matrix.server_java }}
    runs-on: ubuntu-latest
    needs: maven-cache
    strategy:
      fail-fast: false
      matrix:
        include:
          - keycloak: '15.0.2'
            server_java: '11'
            profile: 'undertow15'
          - keycloak: '20.0.5'
            server_java: '17'
            profile: 'keycloak20'
          - keycloak: '21.1.2'
            server_java: '17'
            profile: 'keycloak21'
          - keycloak: '22.0.5'
            server_java: '17'
            profile: 'keycloak22'
          - keycloak: '23.0.7'
            server_java: '17'
            profile: 'keycloak23'
          - keycloak: '24.0.5'
            server_java: '17'
            profile: 'keycloak24'
          - keycloak: '25.0.6'
            server_java: '21'
            profile: 'keycloak25'
          - keycloak: '26.8.2'
            server_java: '25'
            profile: 'keycloak26'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '11'
      - name: Preserve the legacy compiler and unit-test JDK
        run: echo "JAVA11_HOME=$JAVA_HOME" >> "$GITHUB_ENV"
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ matrix.server_java }}
      - name: Preserve the selected server JDK
        run: echo "KEYCLOAK_JAVA_HOME=$JAVA_HOME" >> "$GITHUB_ENV"
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: |
            **/pom.xml
            .github/maven-cache-key
      - name: Verify the selected runtime and integration tests
        env:
          MAVEN_PROFILE: ${{ matrix.profile }}
          EXPECTED_KEYCLOAK: ${{ matrix.keycloak }}
          EXPECTED_SERVER_JAVA: ${{ matrix.server_java }}
        shell: bash
        run: |
          args=(-B verify "-Dtested.keycloak.version=$EXPECTED_KEYCLOAK" "-Dtested.server.java=$EXPECTED_SERVER_JAVA")
          if [[ -n "$MAVEN_PROFILE" ]]; then
            args+=("-P$MAVEN_PROFILE")
          fi
          mvn "${args[@]}"
